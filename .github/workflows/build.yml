name: Find and Get Eaglercraft
on: [push, workflow_dispatch]

jobs:
  search:
    runs-on: ubuntu-latest # 爆速の Linux に切り替えるよ
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Search for Web Files
        run: |
          echo "=== Searching for index.html ==="
          find . -name "index.html"
          
          echo "=== Creating Artifact Folder ==="
          mkdir -p output
          
          # index.html や js ファイル、assets フォルダを全部集めるよ
          # もしビルド済みのものがあれば、これで全部拾える！
          find . -name "index.html" -exec cp --parents {} output/ \;
          find . -name "*.js" -exec cp --parents {} output/ \;
          find . -name "assets" -type d -exec cp -r --parents {} output/ \; 2>/dev/null || true
          
      - name: Upload Everything Found
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-files
          path: output/
