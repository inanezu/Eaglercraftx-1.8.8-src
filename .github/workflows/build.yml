name: Final Emerald Get
on: [push, workflow_dispatch]

jobs:
  get-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Collect Real Game Files
        run: |
          mkdir -p final_bundle
          echo "=== Searching for the REAL treasures ==="
          
          # 1. もしビルド済みのJSやAssetsがあれば回収
          find . -name "classes.js" -exec cp {} final_bundle/ \;
          find . -name "assets.epk" -exec cp {} final_bundle/ \;
          find . -name "assets.epw" -exec cp {} final_bundle/ \;
          find . -name "index.html" -exec cp {} final_bundle/ \;
          
          # 2. 公式の「シングルファイル版」を直接ダウンロードしてくる
          # これは数万人が使っている安定した本物のマイクラ本体だよ！
          curl -L "https://github.com/Lax1dude/eaglercraftx-1.8/raw/main/stable-download/Offline_Download_Version.html" -o final_bundle/Minecraft_1.8.8_Offline.html

          echo "=== Check File Sizes ==="
          ls -lh final_bundle/

      - name: Upload Real Game
        uses: actions/upload-artifact@v4
        with:
          name: REAL-Eaglercraft-Game
          path: final_bundle/
