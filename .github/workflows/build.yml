name: Build Eaglercraft
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Run Build Directly
        shell: cmd
        run: |
          :: ウィザードを飛ばして直接ビルド命令を出すよ！
          call gradlew.bat build --no-daemon
          
      - name: Search for Game Files
        shell: cmd
        run: |
          :: どこにファイルができたか検索してログに出すよ（確認用）
          dir /s /b index.html
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-build
          # どこに生成されてもいいように、ワイルドカードで見つけ出すよ！
          path: |
            **/index.html
            **/classes.js
            **/assets/
            **/lang/
