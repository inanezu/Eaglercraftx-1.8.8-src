name: Build Eaglercraft
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Run Build
        shell: bash
        # ここで「Java 8の場所」と「Javaのバージョン」を強制的に固定するよ
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: |
          # 1. gradlew を探す
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          cd "$(dirname "$GRADLEW_PATH")"
          
          # 2. Javaのパスにある「空白」を消すための魔法の処理
          # Windowsの短いパス形式 (PROGRA~1等) を使って、空白問題を物理的に消去する
          export JAVA_HOME=$(cygpath -ms "$JAVA_HOME")
          echo "Using Java at: $JAVA_HOME"
          
          # 3. 実行権限を付けて、Javaの場所を直接指定して起動！
          chmod +x gradlew
          ./gradlew build --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"
          
      - name: Search and Upload
        if: always() # 失敗しても、どこまで出来たか確認するために実行するよ
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-build
          path: |
            **/index.html
            **/classes.js
            **/assets/
            **/lang/
            **/build/distributions/
