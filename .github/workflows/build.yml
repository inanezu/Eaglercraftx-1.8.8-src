name: Build Eaglercraft
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          # これを足すと、古いツール（Gradle）がJava 8を確実に見つけられるようになるよ！
          cache: 'gradle'
          
      - name: Run Build Directly
        shell: cmd
        env:
          # プログラムに直接「Java 8を使ってね」と教え込むよ
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: |
          for /f "delims=" %%i in ('dir /s /b gradlew.bat') do (
              cd /d "%%~dpi"
              :: --no-daemon をつけて、余計なメモリ消費を抑えるよ
              call gradlew.bat build --no-daemon
              exit /b
          )
          
      - name: Search for Game Files
        shell: cmd
        run: |
          dir /s /b index.html
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-build
          path: |
            **/index.html
            **/classes.js
            **/assets/
            **/lang/
            **/stable-download/
