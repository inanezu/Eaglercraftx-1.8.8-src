name: Get Prebuilt Eaglercraft
on: [push, workflow_dispatch]

jobs:
  get-game:
    runs-on: ubuntu-latest # 最も安定した環境を使うよ
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全ての歴史をチェックする

      - name: Hunt for Artifacts
        run: |
          mkdir -p final_game
          echo "=== Step 1: Searching for any built files in repo ==="
          # リポジトリの中に既に classes.js や assets.epk がないか探す
          find . -type f \( -name "classes.js" -o -name "assets.epk" -o -name "index.html" \) -exec cp {} final_game/ \;
          
          echo "=== Step 2: Downloading the latest stable build if missing ==="
          # もし見つからなかったら、公式（LAX1DUDE）のビルド済みファイルを借りてくる
          if [ ! -f final_game/classes.js ]; then
            curl -L "https://github.com/lax1dude/eaglercraftx-1.8/raw/main/stable-download/Offline_Download_Version.html" -o final_game/Offline.html || true
          fi

      - name: Upload Found Files
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-ready-to-play
          path: final_game/
