name: Search From Source Repo
on: [push, workflow_dispatch]

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strategic Search
        run: |
          mkdir -p found_items
          echo "=== Mini's Deep Scan Starting ==="
          
          # 1. リポジトリ内の 'stable-download' フォルダから取得を試みる
          # (ここは君のリンク先にある可能性が高い場所だよ)
          cp -r gateway/stable-download/* found_items/ 2>/dev/null || echo "Gateway download missing"
          
          # 2. もしファイルがなければ、同じ作者の「完成品専用」の場所から直接持ってくる
          # 1.8.8を動かすのに絶対必要な 3点セットだよ！
          echo "=== Downloading the specific 1.8.8 components ==="
          curl -L "https://github.com/Eaglercraft-Archive/Eaglercraftx-1.8.8-src/raw/main/gateway/stable-download/classes.js" -o found_items/classes.js || true
          curl -L "https://github.com/Eaglercraft-Archive/Eaglercraftx-1.8.8-src/raw/main/gateway/stable-download/assets.epk" -o found_items/assets.epk || true
          curl -L "https://github.com/Eaglercraft-Archive/Eaglercraftx-1.8.8-src/raw/main/gateway/stable-download/index.html" -o found_items/index.html || true

          # 3. サイズ確認（ここで0KBじゃなければ勝ち！）
          ls -lh found_items/

      - name: Upload Final Evidence
        uses: actions/upload-artifact@v4
        with:
          name: FOUND-FROM-SRC-REPO
          path: found_items/
