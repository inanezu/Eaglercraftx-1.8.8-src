name: Grab Real Build
on: [push, workflow_dispatch]

jobs:
  download-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Final Assets
        run: |
          mkdir -p final_game
          echo "=== Downloading Real Offline Build ==="
          # 本物の「1枚で完結するマイクラ」を公式から直接取得
          curl -L "https://github.com/Lax1dude/eaglercraftx-1.8/raw/main/stable-download/Offline_Download_Version.html" -o final_game/Minecraft_1.8.8_Real_Offline.html
          
          echo "=== Downloading Web Files (JS/EPK) ==="
          # もしウェブサイトとして公開したい時用のバラバラのファイルも取得
          curl -L "https://github.com/Lax1dude/eaglercraftx-1.8/raw/main/stable-download/index.html" -o final_game/index.html
          curl -L "https://github.com/Lax1dude/eaglercraftx-1.8/raw/main/stable-download/classes.js" -o final_game/classes.js
          curl -L "https://github.com/Lax1dude/eaglercraftx-1.8/raw/main/stable-download/assets.epk" -o final_game/assets.epk

          echo "=== Verification ==="
          ls -lh final_game/

      - name: Upload Everything
        uses: actions/upload-artifact@v4
        with:
          name: REAL-Eaglercraft-Ready
          path: final_game/
