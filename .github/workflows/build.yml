name: Build Eaglercraft
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Run Build with Forced Java 8
        shell: cmd
        run: |
          :: Java 8の場所を特定するよ
          set "JAVA8_PATH=%JAVA_HOME_8_X64:\=/%"
          
          :: gradlew.bat がある場所を探すよ
          for /f "delims=" %%i in ('dir /s /b gradlew.bat') do (
              cd /d "%%~dpi"
              
              :: ここがポイント！Gradleに「絶対Java 8を使え」という設定ファイルをその場で作るよ
              echo org.gradle.java.home=%JAVA8_PATH% > gradle.properties
              
              :: ビルド実行！
              call gradlew.bat build --no-daemon
              exit /b
          )
          
      - name: Search for Game Files
        shell: cmd
        run: |
          dir /s /b index.html
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-build
          path: |
            **/index.html
            **/classes.js
            **/assets/
            **/lang/
            **/stable-download/
