name: Build Eaglercraft
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Run Build (Gold Version)
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: |
          # 1. gradlew を探して移動
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          cd "$(dirname "$GRADLEW_PATH")"
          
          # 2. 空白問題を解決した短いパスを取得
          SHORT_JAVA_HOME=$(cygpath -ms "$JAVA_HOME")
          echo "Using Java at: $SHORT_JAVA_HOME"
          
          # 3. 実行権限を付与
          chmod +x gradlew
          
          # 4. 【最強の命令】
          # -D で Java の場所を指定し、
          # -P で「Java 8を使うよ」という値を直接流し込む！
          ./gradlew build --no-daemon \
            -Dorg.gradle.java.home="$SHORT_JAVA_HOME" \
            -Ptarget.java.8=true \
            -Porg.gradle.java.installations.auto-detect=false
          
      - name: Upload Result
        if: always() # 成功しても失敗しても、何が出来たか見せてね！
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-build
          path: |
            **/index.html
            **/classes.js
            **/assets/
            **/lang/
            **/build/distributions/
            **/stable-download/
