name: Build Eaglercraft
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Run Build
        # Windows上だけど、より安定した 'bash' を使って実行するよ！
        shell: bash
        run: |
          # 1. gradlew がある場所を自動で見つけるよ
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found!"
            exit 1
          fi
          
          # 2. そのフォルダに移動するよ
          cd "$(dirname "$GRADLEW_PATH")"
          echo "Current directory: $(pwd)"
          
          # 3. 実行権限を与えて、ビルド開始！
          chmod +x gradlew
          ./gradlew build --no-daemon
          
      - name: Search and Upload
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-build
          path: |
            **/index.html
            **/classes.js
            **/assets/
            **/lang/
            **/build/distributions/
