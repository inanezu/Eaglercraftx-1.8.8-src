name: Build Eaglercraft
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Run Build Script (Force Auto)
        shell: cmd
        run: |
          :: 「1」を書き込んだ一時ファイルを作って、それをバッチに読み込ませるよ
          echo 1 > input.txt
          CompileLatestClient.bat < input.txt
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-build
          # フォルダ名が違う可能性を考えて、アスタリスクで広めに指定するよ
          path: |
            stable-download/
            javascript/
            build/
