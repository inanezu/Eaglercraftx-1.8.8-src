name: Build Eaglercraft
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8' # ここを17から8に変えたよ！
          distribution: 'temurin'
          
      - name: Run Build Directly
        shell: cmd
        run: |
          for /f "delims=" %%i in ('dir /s /b gradlew.bat') do (
              cd /d "%%~dpi"
              call gradlew.bat build --no-daemon
              exit /b
          )
          
      - name: Search for Game Files
        shell: cmd
        run: |
          dir /s /b index.html
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-build
          path: |
            **/index.html
            **/classes.js
            **/assets/
            **/lang/
