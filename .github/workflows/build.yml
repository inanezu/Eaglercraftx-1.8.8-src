name: Ultimate Build Eaglercraft
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build Eaglercraft
        shell: cmd
        run: |
          :: gradlew.bat を探して実行
          for /f "delims=" %%i in ('dir /s /b gradlew.bat') do (
              cd /d "%%~dpi"
              set JAVA_HOME=%JAVA_HOME_8_X64%
              call gradlew.bat build --no-daemon -Dorg.gradle.java.home="%JAVA_HOME_8_X64%"
              exit /b
          )

      - name: Find and Collect Finished Files
        if: always()
        shell: bash # Windowsだけどbashを使うことで、賢くファイルを探すよ！
        run: |
          mkdir -p output
          echo "=== Searching for artifacts ==="
          # index.html, classes.js, assets.epk を全フォルダーから探し出す
          find . -type f \( -name "index.html" -o -name "classes.js" -o -name "assets.epk" \) -exec cp {} output/ \;
          # lang フォルダもあればコピー
          find . -type d -name "lang" -exec cp -r {} output/ \; 2>/dev/null || true
          echo "=== Contents of output folder ==="
          ls -R output

      - name: Upload Finished Game
        uses: actions/upload-artifact@v4
        with:
          name: full-eaglercraft-game
          path: output/
