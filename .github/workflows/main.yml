name: Build Eaglercraft
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Run Build Script
        shell: cmd
        run: |
          @echo off
          :: 「1」を自動入力してビルドを開始させる魔法の命令
          echo 1 | CompileLatestClient.bat
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-build
          # ビルド成果物ができる場所。もしエラーが出るならここを 'javascript/' に変えるかも
          path: stable-download/
